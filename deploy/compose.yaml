name: yaya-operation-center

services:
  operation-center:
    container_name: ${CONTAINER_NAME:?set CONTAINER_NAME in deploy/.env or publish.ps1}
    image: yaya-operation-center:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        CARGO_REGISTRIES_CRATES_IO_INDEX: ${CARGO_REGISTRIES_CRATES_IO_INDEX:-sparse+https://rsproxy.cn/index/}
    restart: unless-stopped
    environment:
      YAYA_OPERATION_CENTER_HOST: 0.0.0.0
      YAYA_OPERATION_CENTER_PORT: 8779
      YAYA_OPERATION_CENTER_DB_PATH: /var/lib/yaya-operation-center/operation-center.sqlite3
      YAYA_OPERATION_CENTER_SKILLS_DIR: /var/lib/yaya-operation-center/skills
      YAYA_OPERATION_CENTER_WEB_ORIGIN: ${WEB_ORIGIN:-}
    ports:
      - "${WEB_PORT:-8778}:8778"
      - "${API_PORT:-8779}:8779"
    volumes:
      - operation-center-data:/var/lib/yaya-operation-center
      - ./secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8779/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 6

volumes:
  operation-center-data:
    name: ${CONTAINER_NAME:?set CONTAINER_NAME}-data
